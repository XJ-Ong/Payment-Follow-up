[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Replit dependency environment for Payment Follow-up"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.11.3",
    "fastapi>=0.159.1",
    "httpx>=0.27",
    "openai>=1.0.0",
    "psycopg2-binary>=2.9.13",
